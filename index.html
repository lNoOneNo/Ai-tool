<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>AI Tools Universe</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0f1e}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
body{background:#050810;color:#e2e8f0;font-family:'DM Mono','Courier New',monospace;min-height:100vh;overflow-x:hidden}
header{padding:48px 24px 24px;text-align:center;background:radial-gradient(ellipse 80% 50% at 50% -10%,#1a3a6e44,transparent)}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#1a3a6e33;border:1px solid #2a4a80;border-radius:999px;padding:4px 14px;margin-bottom:20px;font-size:11px;color:#7dd3fc;letter-spacing:.1em}
h1{font-family:'Syne',sans-serif;font-size:clamp(26px,6vw,54px);font-weight:800;background:linear-gradient(135deg,#e2e8f0 0%,#7dd3fc 50%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;margin-bottom:8px}
.subtitle{color:#5a7a9a;font-size:13px;letter-spacing:.05em}
.controls{max-width:1400px;margin:0 auto;padding:16px 20px}
.search-wrap{position:relative;margin-bottom:18px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#3a5a8a;font-size:18px;pointer-events:none}
#searchInput{background:#0d1425;border:1px solid #1a2a45;border-radius:10px;padding:12px 40px 12px 44px;color:#e2e8f0;font-family:'DM Mono',monospace;font-size:14px;width:100%;outline:none;transition:border-color .2s}
#searchInput:focus{border-color:#3a7bd5}
#searchInput::placeholder{color:#3a4a6a}
#clearBtn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#5a7a9a;cursor:pointer;font-size:20px;display:none}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-label{color:#5a7a9a;font-size:11px;letter-spacing:.08em;white-space:nowrap}
.chip{background:#0d1425;border:1px solid #1a2a45;color:#8899bb;border-radius:999px;padding:6px 14px;font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .15s;font-family:'DM Mono',monospace;white-space:nowrap}
.chip:hover{border-color:#3a5a90;color:#e2e8f0}
.chip.active{background:#1a3a6e;border-color:#3a7bd5;color:#7dd3fc}
.chip.free.active{background:#00b89422;border-color:#00b894;color:#00b894}
.chip.freemium.active{background:#fdcb6e22;border-color:#fdcb6e;color:#fdcb6e}
.chip.paid.active{background:#e1700522;border-color:#ff7675;color:#ff7675}
.results-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.count-badge{background:#1a3a6e;color:#7dd3fc;border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:.05em}
#resetBtn{background:none;border:none;color:#5a7a9a;cursor:pointer;font-size:12px;letter-spacing:.05em;font-family:'DM Mono',monospace;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;max-width:1400px;margin:0 auto;padding:0 20px}
.card{background:#0d1425;border:1px solid #1a2a45;border-radius:12px;padding:18px;transition:all .2s;position:relative;overflow:hidden;animation:fadeUp .3s ease both}
.card:hover{border-color:#2a4a80;transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,100,255,.1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-left{display:flex;align-items:center;gap:10px}
.emoji-box{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tool-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:#e2e8f0}
.tool-company{font-size:10px;color:#4a6a8a;letter-spacing:.05em}
.price-badge{border-radius:6px;padding:3px 8px;font-size:9px;letter-spacing:.1em;font-weight:500;flex-shrink:0;font-family:'DM Mono',monospace}
.cat-tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:10px;letter-spacing:.06em;margin-bottom:10px}
.card-desc{font-size:12px;color:#6a8aaa;line-height:1.6;border-top:1px solid #1a2a45;padding-top:10px}
.empty{text-align:center;padding:60px;color:#3a5a7a;grid-column:1/-1}
footer{text-align:center;padding:48px 0 24px;border-top:1px solid #1a2a45;margin-top:40px;color:#3a5a7a;font-size:11px;letter-spacing:.08em;line-height:2}
@media(max-width:480px){header{padding:32px 16px 16px}.grid{grid-template-columns:1fr;padding:0 12px}.controls{padding:12px}}
</style>
</head>

function init(){

categories.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c==="All"?" active":"");b.textContent=c;b.dataset.val=c;b.onclick=()=>setCategory(c);cf.appendChild(b);});

function setPricing(p){activePricing=p;document.querySelectorAll("#pricingFilters .chip").forEach(b=>{b.classList.toggle("active",b.dataset.val===p);});render();}
function setCategory(c){activeCategory=c;document.querySelectorAll("#catFilters .chip").forEach(b=>{b.classList.toggle("active",b.dataset.val===c);});render();}
function clearSearch(){searchVal="";document.getElementById("searchInput").value="";document.getElementById("clearBtn").style.display="none";render();}
function resetFilters(){clearSearch();setPricing("All");setCategory("All");}
function render(){

document.getElementById("resultCount").textContent=filtered.length+" tools";

document.getElementById("resetBtn").style.display=hasFilter?"inline":"none";
const grid=document.getElementById("grid");grid.innerHTML="";
if(!filtered.length){grid.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:12px">🔍</div><div style="font-family:Syne,sans-serif;font-size:18px;margin-bottom:8px">No tools found</div><div>Try different search terms or filters</div></div>';return;}
filtered.forEach((tool,i)=>{const catColor=categoryColors[tool.category]||"#7dd3fc";const ps=pricingStyle[tool.pricing];const card=document.createElement("div");card.className="card";card.style.animationDelay=Math.min(i*0.03,0.5)+"s";card.innerHTML=`<div class="card-top"><div class="card-left"><div class="emoji-box" style="background:${catColor}18;border:1px solid ${catColor}33">${tool.emoji}</div><div><div class="tool-name">${tool.name}</div><div class="tool-company">${tool.company}</div></div></div><span class="price-badge" style="background:${ps.bg};color:${ps.color};border:1px solid ${ps.color}44">${tool.pricing.toUpperCase()}</span></div><div class="cat-tag" style="background:${catColor}12;border:1px solid ${catColor}25;color:${catColor}">${tool.category}</div><div class="card-desc">${tool.primaryUse}</div>`;grid.appendChild(card);});
}
init();
</script>
</body>
</html>
